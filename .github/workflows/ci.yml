# CI for pull requests: install, lint, build
name: PR CI

on:
  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: |
          if bun run | grep -q "lint"; then
            bun run lint
          else
            echo "No lint script; skipping"
          fi

      - name: Typecheck
        run: |
          if bun run | grep -q "check"; then
            bun run check
          else
            echo "No check script; skipping"
          fi
